[project]
name = "ai-video-studyo"
version = "0.1.0"
description = "Tek kullanıcılı AI video prodüksiyon stüdyosu (ElevenLabs + Kling + HeyGen)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "anthropic>=2.14.0",
    "lingua-language-detector>=2.1.1",
    "jsonschema>=4.26.0",
    "argon2-cffi>=25.1.0",
    "psycopg[binary]>=3.3.9",
    "boto3>=1.44.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
